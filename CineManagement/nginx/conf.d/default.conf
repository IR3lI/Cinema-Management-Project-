upstream app_upstream {
    server app:8080;
    keepalive 32;
}

# 1. HTTP Server - Tự động chuyển hướng toàn bộ sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cinemamanagement.id.vn *.cinemamanagement.id.vn cinemanagement.vn localhost;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Cloudflare Origin CA TLS 1.3 Termination & WebSocket Proxying
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cinemamanagement.id.vn *.cinemamanagement.id.vn cinemanagement.vn localhost;

    # Cloudflare Origin CA Certificates
    ssl_certificate /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    # SignalR Real-Time WebSocket Proxying
    location /seatBookingHub {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Disable buffering and enable long timeout for permanent WebSockets
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # General Web Application Traffic
    location / {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
